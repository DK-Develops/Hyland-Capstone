<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="weather-app">
      <h1>Weather App</h1>

      <form id="weather-form" class="weather-form" autocomplete="off">
        <input id="city-input" type="text" name="city" placeholder="Enter city name" required />
        <button type="submit">Get Weather</button>
      </form>

      <div id="error-message" class="error-message"></div>

      <div id="weather-card" class="weather-card hidden">
        <h2 id="weather-city" class="weather-city"></h2>
        <div class="weather-main" id="weather-main"></div>
        <div class="weather-details">
          <div>Temperature: <span id="weather-temp"></span> °C</div>
          <div>Feels like: <span id="weather-feels"></span> °C</div>
          <div>Humidity: <span id="weather-humidity"></span> %</div>
          <div>Wind: <span id="weather-wind"></span> m/s</div>
          <div>Condition: <span id="weather-condition"></span></div>
        </div>
      </div>

      <p class="hint">Tip: Try "New York", "London", or "Tokyo".</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
